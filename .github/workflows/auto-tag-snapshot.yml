name: Auto-tag (snapshot)

on:
  push:
    branches:
      - snapshot
  pull_request:
    branches:
      - snapshot

jobs:
  version:
    name: Lire la version et calculer le prochain rc.N
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      rc: ${{ steps.version.outputs.rc }}
      previous_tag: ${{ steps.previous.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lire APP_VERSION et calculer le tag rc
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('src/core/version.py').read()); print(APP_VERSION)")
          DERNIER_RC=$(git tag --list "V${VERSION}-rc.*" | sed -E "s/^V${VERSION}-rc\.([0-9]+)$/\1/" | sort -n | tail -n1)
          PROCHAIN_RC=$(( ${DERNIER_RC:-0} + 1 ))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "rc=$PROCHAIN_RC" >> $GITHUB_OUTPUT
          echo "tag=V${VERSION}-rc.${PROCHAIN_RC}" >> $GITHUB_OUTPUT

      - name: Déterminer le tag précédent (stable ou snapshot)
        id: previous
        run: |
          echo "tag=$(git tag --list --sort=-creatordate | head -n1)" >> $GITHUB_OUTPUT

      - name: Bloquer si la version est déjà publiée en stable
        run: |
          VERSION=$(python3 -c "exec(open('src/core/version.py').read()); print(APP_VERSION)")
          if git tag --list | grep -qx "V${VERSION}"; then
            echo "::error::Le tag V${VERSION} existe déjà en version stable. Incrémentez APP_VERSION dans src/core/version.py avant de créer un nouveau snapshot."
            exit 1
          fi

  verify-docs:
    name: Vérifier la documentation de version
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Vérifier le patch note pour les versions majeures et mineures
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CORRECTIF=$(echo "$VERSION" | cut -d. -f3)
          if [ "$CORRECTIF" = "0" ]; then
            FICHIER="docs/PATCHNOTE_V${VERSION}.md"
            if [ ! -f "$FICHIER" ]; then
              echo "::error::$FICHIER est manquant. Les versions majeures et mineures (X.Y.0) doivent avoir un patch note utilisateur dans docs/."
              exit 1
            fi
          else
            echo "Version de correctif (${VERSION}) : patch note non requis, seul le CHANGELOG est obligatoire."
          fi

      - name: Vérifier la mention de la version dans le README
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if ! grep -q "<td>${VERSION}</td>" README.md; then
            echo "::error::README.md ne mentionne pas la version ${VERSION} dans le tableau « Historique des versions »."
            exit 1
          fi

      - name: Vérifier la mise à jour d'ARCHITECTURE.md si src/ a changé
        run: |
          PREV="${{ needs.version.outputs.previous_tag }}"
          if [ -z "$PREV" ]; then
            echo "Aucun tag précédent, vérification ignorée."
            exit 0
          fi
          if git diff --name-only "$PREV"..HEAD -- src/ | grep -q .; then
            if ! git diff --name-only "$PREV"..HEAD -- docs/ARCHITECTURE.md | grep -q .; then
              echo "::error::src/ a changé depuis $PREV mais docs/ARCHITECTURE.md n'a pas été mis à jour."
              exit 1
            fi
          fi

      - name: Vérifier la syntaxe du fichier de compilation (*.spec)
        run: python3 -m py_compile morphoz_snackapp.spec

  tag:
    name: Créer le tag de snapshot
    needs: [version, verify-docs]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: snapshot
          fetch-tags: true

      - name: Créer et pousser le tag
        run: |
          git tag "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

  build:
    name: Compiler et publier le snapshot
    needs: [version, tag]
    if: github.event_name == 'push' && needs.tag.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      release_name: "Snapshot ${{ needs.version.outputs.version }}-rc.${{ needs.version.outputs.rc }}"
      prerelease: true
